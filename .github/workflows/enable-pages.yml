name: Enable GitHub Pages

on:
  push:
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable legacy Pages from main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "create_status=${code}"
          cat /tmp/pages-create.json
          echo
          if [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
            exit 1
          fi
          echo "---- pages site ----"
          gh api "repos/${repo}/pages"
          echo "---- request build ----"
          gh api --method POST "repos/${repo}/pages/builds" || true
